{% extends "base_parent.html" %}
{% block title %}Настройки{% endblock %}
{% block content %}
<h1>Настройки</h1>
<form method="post" action="/parent/settings" class="card">
  <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
  <h2>Счётчик дней до этапа</h2>
  <p class="hint">Ребёнок видит число дней и дату этапа на экране «Сегодня». По умолчанию выключено.</p>
  <p><label><input type="checkbox" name="show_exam_countdown" value="1"{% if settings.show_exam_countdown %} checked{% endif %}> Показывать ребёнку</label></p>
  <p><label for="stage_date">Дата этапа</label>
     <input id="stage_date" type="date" name="stage_date" value="{{ settings.stage_date or "" }}"></p>
  {% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
  <button class="primary">Сохранить</button>
</form>
{% endblock %}
