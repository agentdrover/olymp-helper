{% extends "base.html" %}
{% block title %}Вход родителя{% endblock %}
{% block content %}
<div class="login">
  <form method="post" action="/parent/login" class="card login-card">
    <a href="/">← Назад к помощнику</a>
    <h1>Вход для родителя</h1>
    <label for="key">Ключ</label>
    <input id="key" type="password" name="key" autocomplete="current-password" required>
    {% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
    <button class="primary">Войти</button>
  </form>
</div>
{% endblock %}
