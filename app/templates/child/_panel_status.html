{# Общий компонент состояния запроса к модели (SPEC-1.0 1.3а). Его же берёт T07 для чата и голоса.
   Вход: p = {state, text, busy}. #}
<div class="helper-status helper-{{ p.state }}" role="status" aria-live="polite" data-panel="{{ p.state }}"{% if p.step %} data-step="{{ p.step }}" data-started="{{ p.started_at }}" data-elapsed="{{ p.elapsed_s }}"{% endif %}>{{ p.text }}</div>
