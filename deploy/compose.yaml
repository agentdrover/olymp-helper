# Два контейнера (ADR 0001): приложение и исполнитель модели. Установка на K8 - home-infra (#2021).
# Запуск: docker compose -f deploy/compose.yaml up -d  (переменные - в docs/deploy.md).
services:
  app:
    build:
      context: ..
      dockerfile: Containerfile
    image: olymp-app:local
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - /srv/olymp:/srv/olymp
      - ${OLYMP_CERT_DIR:-/srv/olymp-certs}:/certs:ro
    environment:
      - OLYMP_DB=/srv/olymp/olymp.db
      - OLYMP_PORT=8443
      - OLYMP_TLS_CERT=/certs/server.pem
      - OLYMP_TLS_KEY=/certs/server.key
      - EXECUTOR_SHARED_KEY
      - OLYMP_PARENT_KEY
    healthcheck:
      test: ["CMD", "python", "/app/deploy/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 2g
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp

  # Исполнители моделей (OH-T03, #2013): по контейнеру на канал, у каждого только свой токен.
  # Единственное описание исполнителей (сверка #2013 и #2014): корень только для чтения, /work -
  # tmpfs сервера исполнителя (uid 10001, 0711), без /tmp и /dev/shm, нулевые лимиты IPC, общий
  # ключ с приложением. Почему каждая строка такая - SPEC-1.0 §1.4 и deploy/executor/sandbox.sh.
  executor-codex:
    build:
      context: ..
      dockerfile: deploy/executor/Containerfile.codex
    image: ${OLYMP_CODEX_EXECUTOR_IMAGE:-olymp-executor-codex:local}
    environment:
      EXECUTOR_CHANNEL: codex
      EXECUTOR_WORKROOT: /work
      CODEX_SEED_DIR: /codex-seed
      EXECUTOR_SHARED_KEY: ${EXECUTOR_SHARED_KEY:?shared with the app, set by home-infra}
    volumes:
      - ${CODEX_SEED_DIR:?set the sbx proxy seed directory}:/codex-seed:ro
    read_only: true
    # /dev/shm Docker монтирует отдельно с правами 1777, read_only его не закрывает: без него
    # CLI негде оставить данные между запусками (ревью #2013, круг 4). Очереди POSIX и объекты SysV
    # IPC остаются в пространстве имён: их убирает и проверяет reset после каждого запуска (круг 5).
    ipc: none
    # Лимиты пространства имён IPC: с нулевыми лимитами объект IPC создать нельзя, значит никакое
    # состояние IPC не может пережить запуск (ревью #2013, круг 6). reset и проверка - страховка.
    sysctls:
      kernel.msgmni: "0"
      kernel.sem: "0 0 0 0"
      kernel.shmmni: "0"
      kernel.shm_rmid_forced: "1"
      fs.mqueue.queues_max: "0"
    tmpfs:
      - /work:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0711
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8099/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    expose:
      - "8099"

  executor-cursor:
    build:
      context: ..
      dockerfile: deploy/executor/Containerfile.cursor
    image: ${OLYMP_EXECUTOR_IMAGE:-olymp-executor:local}
    environment:
      EXECUTOR_CHANNEL: cursor
      EXECUTOR_WORKROOT: /work
      CURSOR_API_KEY: ${CURSOR_API_KEY:?set at run time by home-infra}
      EXECUTOR_SHARED_KEY: ${EXECUTOR_SHARED_KEY:?shared with the app, set by home-infra}
    read_only: true
    # /dev/shm Docker монтирует отдельно с правами 1777, read_only его не закрывает: без него
    # CLI негде оставить данные между запусками (ревью #2013, круг 4). Очереди POSIX и объекты SysV
    # IPC остаются в пространстве имён: их убирает и проверяет reset после каждого запуска (круг 5).
    ipc: none
    # Лимиты пространства имён IPC: с нулевыми лимитами объект IPC создать нельзя, значит никакое
    # состояние IPC не может пережить запуск (ревью #2013, круг 6). reset и проверка - страховка.
    sysctls:
      kernel.msgmni: "0"
      kernel.sem: "0 0 0 0"
      kernel.shmmni: "0"
      kernel.shm_rmid_forced: "1"
      fs.mqueue.queues_max: "0"
    tmpfs:
      - /work:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0711
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8099/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    expose:
      - "8099"
