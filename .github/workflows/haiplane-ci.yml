# Laid down by Haiplane Hub provisioning (#476) — do not rename this file.
#
# PRODUCER half of the trusted CI report (#1848, #2028). This job runs the code
# of a task branch, so it holds NO key that makes the hub believe a report: no
# `environment`, no HAIPLANE_HUB_CI_TOKEN. The only hub secret here is the READ
# key HAIPLANE_HUB_CI_READ_TOKEN. The results go to hub-ci-results/ and are
# uploaded as the artifact hub-ci-results-<run_attempt>; the report itself is
# sent by haiplane-ci-report.yml from main. The checks named below are exactly
# the `required_checks` of the project's ci_contract: lint, tests.
#
# The hub owns the name `haiplane-ci.yml` and nothing else in this
# directory. It is written only
# into a repository that carried NO workflows of its own, so this file never
# replaced an opinion somebody else had already expressed about CI here.
#
# What it is for: the delivery gate merges a pull request only after reading a
# workflow's outcome. With no workflow at all the probe answers "absent" and
# approved, green work cannot be delivered by any supported path.
name: Haiplane CI

on:
  # No base-branch allowlist, deliberately (#475/#476). The gate reads THIS
  # workflow's outcome, so a base the list did not name produces no run, and
  # the branch a project integrates on is a project setting the hub resolves
  # from project.default_branch — not a list somebody must remember to edit
  # here when the repository renames its integration branch.
  pull_request:
  # Push IS named explicitly, and the list is rendered per project rather than
  # written here: it is what produces evidence for a pair task, which lands
  # work without ever opening a pull request. The CI report is keyed by
  # COMMIT, so a push of the task branch is enough.
  push:
    branches: ["main", "task-*/**"]

permissions:
  contents: read

jobs:
  test:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The hub pins a commit at submission (#572) and compares it against
          # the branch head before merging; a depth-1 checkout cannot answer
          # that comparison.
          fetch-depth: 0

      # ffmpeg for the one voice test that converts a real WebM recording (OH-T07, test_ac4).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Required steps of this repository (OH-T02, #2012). Any failing step, and
      # a run that collects no tests at all (pytest exits 5), turns this job red.
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies (lockfile must be current)
        run: uv sync --frozen

      - name: Lockfile is up to date
        run: uv lock --check

      # `id`s lint and tests: their outcomes are the reported checks below.
      - name: Lint
        id: lint
        run: uv run --frozen ruff check .

      - name: Tests
        id: tests
        run: uv run --frozen pytest -q

      # AC-5 and AC-8 of OH-T03 (#2013): builds the model-executor image and checks its sandbox
      # from the inside. No secrets, no real CLI calls. BEFORE the reporter below.
      - name: executor-sandbox
        id: executor-sandbox
        run: bash deploy/executor/sandbox.sh

      # OH-T04 (#2014): the application image is built, started on a temporary volume and
      # checked (healthz over HTTPS, data survives recreation, speech recognition of a WAV
      # sample without network, token patterns in the image). Needs no secrets; the container
      # and volume are removed by the script on any exit. Runs before the reporter.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: image-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          tags: olymp-app:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: image-smoke
        run: bash deploy/image-smoke.sh olymp-app:ci

      # Collects the AC test and validation results of THIS commit without any
      # write key. Never fails the job. head-sha is explicit: on pull_request
      # events GITHUB_SHA is a throwaway merge commit.
      - name: Collect AC test and validation results for the Hub
        if: ${{ always() }}
        continue-on-error: true
        uses: agentdrover/haiplane/.github/actions/hub-ci-report@main
        with:
          hub-url: ${{ secrets.HAIPLANE_HUB_URL }}
          hub-read-token: ${{ secrets.HAIPLANE_HUB_CI_READ_TOKEN }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          ac-runner: "uv run --frozen pytest"
          event-action: ${{ github.event.action }}
          # A step that never ran reports '' and is dropped - silence, not a pass.
          checks: |-
            lint=${{ steps.lint.outcome }}
            tests=${{ steps.tests.outcome }}

      - name: Upload results for the trusted report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hub-ci-results-${{ github.run_attempt }}
          path: hub-ci-results/
          if-no-files-found: ignore
          retention-days: 7
